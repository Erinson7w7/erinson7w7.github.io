
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TE VEO</title>
  <link rel="stylesheet" href="style.css">

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    #contenido {
      display: block;
      width: 100%;
      height: calc(100dvh - 100px);
      border: none;
    }

    .reproductor-fijo {
      position: fixed;
      bottom: 0;
      left: 0;
      z-index: 1000;
      box-sizing: border-box;
      width: 100%;
      height: 100px;
      padding: 10px 18px;
      background: #111;
      color: #ddd;
      border-top: 1px solid #333;
      font-family: inherit;
    }

    .reproductor-fijo p {
      margin: 0 0 6px;
      font-size: 12px;
      letter-spacing: 1px;
    }

    .reproductor-fijo audio {
      display: block;
      width: 100%;
      max-width: 500px;
      height: 38px;
    }
  </style>
</head>

<body>
  <iframe
    id="contenido"
    name="contenido"
    src="inicio.html"
    title="Contenido de TE VEO">
  </iframe>

  <div class="reproductor-fijo">
    <p>una canción.</p>
    <audio controls preload="metadata">
      <source src="musica/Primera-01.mp3" type="audio/mpeg">
      Tu navegador no puede reproducir este audio.
    </audio>
  </div>
</body>
</html>
