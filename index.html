<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>cargando...</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<style>
  :root {
    --fondo: #070707;
    --campo: #101010;
    --borde: #4b4b4b;
    --texto: #ececec;
    --suave: #8a8a8a;
    --tenue: #6e6e6e;
    --pie: #4a4a4a;
    --boton: #e2e2e2;
    --error: #c06a6a;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--fondo);
    color: var(--texto);
    font-family: 'Noto Serif',Georgia, Serif;
    -webkit-font-smoothing: antialiased;
  }
  [hidden] { display: none !important; }

  .pantalla {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 20px;
  }

  .etiqueta {
    margin: 0 0 28px;
    font-size: 13px;
    letter-spacing: 0.32em;
    color: var(--tenue);
    text-transform: uppercase;
  }
  h1 { margin: 0 0 14px; font-size: 2.15rem; font-weight: 400; color: var(--texto); }
  .ayuda { margin: 0 0 34px; color: var(--suave); font-size: 1rem; }

  #acceso { transition: opacity 0.6s ease, transform 0.6s ease; }
  #acceso.sale { opacity: 0; transform: translateY(-10px); }
  .centro { width: min(525px, 100%); margin-top: 18vh; text-align: center; }

  input[type="password"] {
    width: 100%;
    height: 58px;
    background: var(--campo);
    color: var(--texto);
    border: 1px solid var(--borde);
    border-radius: 6px;
    text-align: center;
    font-family: inherit;
    font-size: 1rem;
    outline: none;
    transition: border-color 0.2s ease;
  }
  input::placeholder { color: #7a7a7a; }
  input:focus { border-color: #8c8c8c; }
  input.tiembla { animation: tiembla 0.4s ease; border-color: var(--error); }

  button {
    width: 100%;
    height: 52px;
    margin-top: 14px;
    background: var(--boton);
    color: #000;
    border: 0;
    border-radius: 6px;
    font-family: inherit;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background 0.2s ease;
  }
  button:hover { background: #f0f0f0; }
  button:disabled { opacity: 0.6; cursor: wait; }

  .error { min-height: 1.4em; margin: 16px 0 0; color: var(--error); font-size: 0.9rem; }

  .pie { margin-top: auto; padding: 40px 0 28px; color: var(--pie); font-size: 0.85rem; }

  @keyframes tiembla {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-10px); }
    40% { transform: translateX(10px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }

  #notas.entra { animation: entra 0.9s ease both; }
  @keyframes entra {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .contenido { width: min(640px, 100%); margin-top: 12vh; }
  .contenido .etiqueta { text-align: left; }
  .contenido h1 { margin-bottom: 36px; }

  .nota { border-top: 1px solid #1f1f1f; padding: 30px 0; }
  .nota .fecha { margin: 0 0 10px; font-size: 12px; letter-spacing: 0.24em; color: var(--tenue); text-transform: uppercase; }
  .nota h2 { margin: 0 0 14px; font-size: 1.35rem; font-weight: 400; }
  .nota p { margin: 0 0 14px; color: #cfcfcf; line-height: 1.8; }
  .vacio { color: var(--suave); }

  @media (prefers-reduced-motion: reduce) {
    #acceso { transition: none; }
    input.tiembla, #notas.entra { animation: none; }
  }
</style>
</head>
<body>

<div class="pantalla" id="acceso">
  <main class="centro">
    <p class="etiqueta" id="tEtiqueta"></p>
    <h1 id="tTitulo"></h1>
    <p class="ayuda" id="tAyuda"></p>
    <form id="form" autocomplete="off">
      <input id="clave" type="password" aria-label="Contraseña" autocomplete="off">
      <button type="submit" id="boton"></button>
    </form>
    <p class="error" id="error" role="alert"></p>
  </main>
  <footer class="pie" id="tPie"></footer>
</div>

<div class="pantalla" id="notas" hidden>
  <main class="contenido">
    <p class="etiqueta" id="tEtiquetaDentro"></p>
    <h1 id="tTituloDentro"></h1>
    <div id="lista"></div>
  </main>
  <footer class="pie" id="tPieDentro"></footer>
</div>

<script>

const TEXTOS = {
  etiqueta: 'GOTY',
  titulo: 'APRENDIENDOANDO',
  ayuda: 'Introduce la contraseña para continuar',
  placeholder: 'nose',
  boton: '._.',
  abriendo: 'abriendo…',
  error: 'ni pa eso',
  espera: 'espera p',
  sinDatos: 'no hay',
  pie: '2026',
  etiquetaDentro: 'equisde',
  tituloDentro: 'otra vez',
  vacio: 'nada no hay, no exitee xD',
};


const $ = (id) => document.getElementById(id);

const IT = 250000;
const deB64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function derivar(clave, sal, it) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(clave), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: sal, iterations: it, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
  );
}
async function descifrar(clave, p) {
  const llave = await derivar(clave, deB64(p.salt), p.it || IT);
  const plano = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: deB64(p.iv) }, llave, deB64(p.datos));
  return JSON.parse(new TextDecoder().decode(plano));
}

$('tEtiqueta').textContent = TEXTOS.etiqueta;
$('tTitulo').textContent = TEXTOS.titulo;
$('tAyuda').textContent = TEXTOS.ayuda;
$('clave').placeholder = TEXTOS.placeholder;
$('boton').textContent = TEXTOS.boton;
$('tPie').textContent = TEXTOS.pie;
$('tEtiquetaDentro').textContent = TEXTOS.etiquetaDentro;
$('tTituloDentro').textContent = TEXTOS.tituloDentro;
$('tPieDentro').textContent = TEXTOS.pie;


let paquete = null;
let falloCarga = false;
fetch('datos/notas.json', { cache: 'no-store' })
  .then((r) => { if (!r.ok) throw new Error(); return r.json(); })
  .then((p) => { paquete = p; })
  .catch(() => { falloCarga = true; });


function pintar(notas) {
  const lista = $('lista');
  lista.replaceChildren();
  if (!notas.length) {
    const v = document.createElement('p');
    v.className = 'vacio';
    v.textContent = TEXTOS.vacio;
    lista.append(v);
    return;
  }
  for (const n of notas) {
    const art = document.createElement('article');
    art.className = 'nota';
    if (n.fecha) {
      const f = document.createElement('p');
      f.className = 'fecha';
      f.textContent = n.fecha;
      art.append(f);
    }
    if (n.titulo) {
      const h = document.createElement('h2');
      h.textContent = n.titulo;
      art.append(h);
    }
    for (const parrafo of String(n.texto || '').split(/\n{2,}/)) {
      if (!parrafo.trim()) continue;
      const p = document.createElement('p');
      p.textContent = parrafo;
      art.append(p);
    }
    lista.append(art);
  }
}

$('form').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const campo = $('clave');
  const clave = campo.value;
  if (!clave) return;

  if (!paquete) {
    $('error').textContent = falloCarga ? TEXTOS.sinDatos : TEXTOS.espera;
    return;
  }

  $('boton').disabled = true;
  $('boton').textContent = TEXTOS.abriendo;
  $('error').textContent = '';

  try {
    const notas = await descifrar(clave, paquete);
    campo.value = '';
    pintar(notas);
    $('acceso').classList.add('sale');
    setTimeout(() => {
      $('acceso').hidden = true;
      $('notas').hidden = false;
      $('notas').classList.add('entra');
      window.scrollTo(0, 0);
    }, 600);
  } catch (e) {
    $('boton').disabled = false;
    $('boton').textContent = TEXTOS.boton;
    $('error').textContent = TEXTOS.error;
    campo.classList.remove('tiembla');
    void campo.offsetWidth;
    campo.classList.add('tiembla');
    campo.select();
  }
});
//sapea nomasxdddddddddddddddddddddddddddddddddddddddddddddd
</script>
</body>
</html>
